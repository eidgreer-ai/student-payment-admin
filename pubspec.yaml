name: student_payment_admin
description: تطبيق إدارة الطلاب والمدفوعات - نظام متكامل لإدارة المجموعات والمدفوعات الشهرية
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # State Management
  provider: ^6.1.0
  
  # Localization (Arabic Support)
  intl: ^0.19.0
  
  # UI & Navigation
  go_router: ^14.0.0
  
  # Icons & Assets
  cupertino_icons: ^1.0.6
  
  # Utilities
  crypto: ^3.0.3
  intl_utils: ^2.8.5
  
  # File handling for export
  excel: ^2.1.0
  pdf: ^3.10.0
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
